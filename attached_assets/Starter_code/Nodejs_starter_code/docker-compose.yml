version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/insurance?schema=public
      - PORT=4000
      - DEFAULT_ROLE=agent
    depends_on:
      - db
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node src/server.js"
volumes:
  dbdata:


