version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5434:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      - DATABASE_URL=Host=db;Port=5432;Database=insurance;Username=postgres;Password=postgres
    ports:
      - "8082:8080"
    depends_on:
      - db
volumes:
  dbdata:


