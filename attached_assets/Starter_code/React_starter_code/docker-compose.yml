version: '3.9'
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      - VITE_API_BASE_URL=http://mock-api:4000
    depends_on:
      - mock-api
  mock-api:
    image: ghcr.io/typicode/json-server
    command: ["--host", "0.0.0.0", "--port", "4000", "/data/db.json"]
    volumes:
      - ./mock-api/db.json:/data/db.json:ro
    ports:
      - "4000:4000"


