version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      - DATABASE_URL=jdbc:postgresql://db:5432/insurance
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - db
volumes:
  dbdata:


