version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5435:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/insurance
    ports:
      - "4000:4000"
    depends_on:
      - db
volumes:
  dbdata:


