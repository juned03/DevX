version: '3.9'
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance
    ports:
      - "5437:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
  api:
    build: .
    environment:
      - POSTGRES_DB=insurance
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    ports:
      - "8001:8000"
    depends_on:
      - db
volumes:
  dbdata:
